# Render Blueprint (https://render.com/docs/blueprint-spec): backend as a Docker web service + Redis.
# Database: Neon or Supabase (free PostgreSQL with pgvector) -> set DATABASE_URL to
#   jdbc:postgresql://<host>/<db>?sslmode=require   and DATABASE_USERNAME / DATABASE_PASSWORD.
# RabbitMQ (optional): CloudAMQP free plan -> RABBITMQ_ENABLED=true, RABBITMQ_URL=amqps://...
# Frontend: Vercel (frontend/vercel.json) with VITE_API_BASE_URL=https://<this service>.onrender.com/api
services:
  - type: web
    name: shoppi-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CACHE_TYPE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shoppi-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: JAVA_OPTS
        value: -Xmx384m -XX:+UseSerialGC
  - type: keyvalue
    name: shoppi-redis
    plan: free
    ipAllowList: []
