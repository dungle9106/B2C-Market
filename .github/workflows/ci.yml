# Build check on every push / pull request: backend compiles and packages, frontend builds,
# both Docker images build. (Deployment: Render redeploys the backend and Vercel the frontend from GitHub.)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -q package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  review-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx
      - run: python -c "from fastapi.testclient import TestClient; from app.main import app; c = TestClient(app); assert c.get('/health').json()['status'] == 'UP'; r = c.post('/analyze', json={'items':[{'id':1,'rating':1,'content':'Hàng giả, bị dị ứng'}]}).json(); assert 'AUTHENTICITY' in r['results'][0]['issues']"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, review-ai]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shoppi-backend ./backend
      - run: docker build -t shoppi-frontend ./frontend
      - run: docker build -t shoppi-review-ai ./review-ai-service
