# ==== Server ====
server.port=${PORT:8081}

# ==== Database (PostgreSQL) ====
# Local dev example: create a DB named "marketplace" first
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/marketplace}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# load lazy associations (product -> shop, images, variants...) in batches
# instead of one query per row when mapping product lists to DTOs
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ==== File uploads (product images/videos, review photos) ====
# Stored on local disk and served at /uploads/**. Fine for dev and the demo;
# on hosts with an ephemeral disk (Render, Railway...) use a mounted volume.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ==== Order tracking simulator ====
# seconds between the simulated carrier scans of a SHIPPING order (short for demos)
app.shipping.sim-step-seconds=${SHIPPING_SIM_STEP_SECONDS:60}

# ==== JWT ====
# Change this secret before deploying. Must be >= 256 bits (32 chars) for HS256.
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_STRING_BEFORE_DEPLOY}
# access token: short-lived; the frontend renews it with the refresh token (app.jwt.refresh-days)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:14}

# ==== CORS ====
# Comma-separated origin patterns. Any localhost port is allowed in dev because
# Vite silently moves to 5174, 5175... when 5173 is already taken. In production
# set CORS_ALLOWED_ORIGINS to the real frontend URL (e.g. https://shoppi.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ==== Google OAuth2 login (Spring Security oauth2Login) ====
# Create an OAuth Client ID (type "Web application") in Google Cloud Console
# -> APIs & Services -> Credentials, and add this "Authorized redirect URI":
#     http://localhost:8081/login/oauth2/code/google
# Then set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET as environment variables.
# The placeholder defaults only exist so the app still starts without them
# (clicking "Dang nhap voi Google" will then fail on Google's side).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:chua-cau-hinh}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:chua-cau-hinh}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where the backend sends the browser after Google login finishes; the
# frontend reads our JWT (or an error) from the URL fragment there. The
# frontend passes its own origin (?redirect_origin=...) when starting the
# login, and that wins if it matches app.cors.allowed-origins; this URL is
# only the fallback.
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# ==== AI / LLM ====
# app.ai.provider selects which backend AIService calls:
#   openai       -> OpenAI's hosted API (default, most reliable for the demo)
#   huggingface  -> the self-trained Vistral-7B model, hosted on a Hugging
#                   Face Inference Endpoint (see ai-finetune/DEPLOY_HF_ENDPOINT.md)
app.ai.provider=${AI_PROVIDER:openai}

# --- OpenAI provider ---
# Set the real key via environment variable OPENAI_API_KEY, do not hardcode it here.
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# --- Hugging Face provider (fine-tuned Vistral-7B) ---
# Fill these in after completing ai-finetune/DEPLOY_HF_ENDPOINT.md.
# Leave endpoint-url blank until then; AIService will fall back to a
# friendly "not configured" message rather than erroring if provider is
# set to huggingface before this is filled in.
app.ai.huggingface.endpoint-url=${HF_ENDPOINT_URL:}
app.ai.huggingface.token=${HF_TOKEN:}

# the shop website (links in e-mails, payment return pages)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- cache: "redis" (shared, REDIS_URL) or "memory" (Caffeine, default) ----
app.cache.type=${CACHE_TYPE:memory}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.repositories.enabled=false

# ---- message queue: e-mails go through RabbitMQ when RABBITMQ_URL is set, else the database queue ----
app.messaging.rabbit=${RABBITMQ_ENABLED:false}
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}

# ---- review hub: optional FastAPI service for review classification (folder review-ai-service/) ----
app.review-ai.url=${REVIEW_AI_URL:}
